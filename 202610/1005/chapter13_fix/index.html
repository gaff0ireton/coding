<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form.elementsですべてのフォーム部品を取得する</title>
    <meta
        name="description"
        content="form.elementsを使って、フォーム内のすべてのフォーム部品を取得する方法について解説します。" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" type="module"></script>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="flcon">
                <div class="logo">
                    <a href="index.html"><img src="res/logo.svg" alt="JavaScript" width="60" /></a>
                </div>
                <div class="title">
                    <h1>form.elementsですべてのフォーム部品を取得する</h1>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <form action="#" id="login">
                <!-- １行のテキストを入力するフィールド -->
                <dl>
                    <dt><label for="text">text</label></dt>
                    <dd>
                        <input type="text" id="text" name="text" />
                        <button type="button" id="btn-text">値を取得</button>
                    </dd>
                    <dd><output id="result"></output></dd>
                </dl>

                <!-- テキストエリア -->
                <dl>
                    <dt><label for="textarea">textarea</label></dt>
                    <dd>
                        <textarea name="textarea" id="textarea" cols="30" rows="10"></textarea>
                        <button type="button" id="btn-textarea">値を取得</button>
                    </dd>
                </dl>

                <!-- 数値入力フィールド -->
                <dl>
                    <dt><label for="number">number</label></dt>
                    <dd>
                        <input type="number" id="number" name="number" />
                        <button type="button" id="btn-number">値を取得</button>
                    </dd>
                </dl>

                <!-- 範囲入力フィールド -->
                <dl>
                    <dt><label for="range">range</label></dt>
                    <dd>
                        <input type="range" id="range" name="range" />
                        <button type="button" id="btn-range">値を取得</button>
                    </dd>
                    <dd><output id="val"></output></dd>
                </dl>

                <!-- 日付入力フィールド  -->
                <dl>
                    <dt><label for="date">date</label></dt>
                    <dd>
                        <input type="date" id="date" name="date" />
                        <button type="button" id="btn-date">値を取得</button>
                    </dd>
                </dl>

                <!-- 色入力フィールド -->
                <dl>
                    <dt><label for="color">color</label></dt>
                    <dd>
                        <input type="color" id="color" name="color" />
                        <button type="button" id="btn-color">値を取得</button>
                    </dd>
                </dl>

                <!-- ラジオボタン -->
                <dl>
                    <dt>radio</dt>
                    <dd>
                        <label><input type="radio" name="payment" value="method1" />クレジットカード</label>
                        <label><input type="radio" name="payment" value="method2" />代引き（+¥500-）</label>
                    </dd>
                    <dd>
                        <button type="button" id="btn-payment">値を取得</button>
                    </dd>
                </dl>
                <!-- チェックボックスが１つだけの場合 -->
                <dl>
                    <dt>チェックボックスが１つだけの場合</dt>
                    <dd><input type="checkbox" id="checkbox" name="check-single" value="check-value" />Check</dd>
                    <dd>
                        <button type="button" id="btn-checkbox-single" disabled>値を取得</button>
                    </dd>
                </dl>

                <!-- チェックボックスが複数ある場合 -->
                <dl>
                    <dt>好きな味を選んでください</dt>
                    <dd>
                        <label><input type="checkbox" name="checkbox-multi" value="marmalade" />マーマレード</label><br />
                        <label><input type="checkbox" name="checkbox-multi" value="peach" />ピーチ</label><br />
                        <label><input type="checkbox" name="checkbox-multi" value="strawberry" />ストロベリー</label><br />
                        <label><input
                                type="checkbox"
                                name="checkbox-multi"
                                value="applecinamon" />アップル&シナモン</label><br />
                    </dd>
                    <dd>
                        <button type="button" id="btn-checkbox-multi">値を取得</button>
                    </dd>
                </dl>

                <!-- ドロップダウンメニュー -->
                <dl>
                    <dt>ドロップダウンメニュー</dt>
                    <dd>
                        <select name="single-select" id="single-select">
                            <option>選んでください</option>
                            <option value="express">急行</option>
                            <option value="rapid">快速</option>
                            <option value="local">各駅停車</option>
                        </select>
                        <button type="button" id="btn-single-select">値を取得</button>
                    </dd>
                </dl>

                <!-- リストボックス -->
                <dl>
                    <dt>リストボックス</dt>
                    <dd>
                        <select name="multi-select" id="multi-select" multiple>
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="php">PHP</option>
                        </select>
                        <button type="button" id="btn-multi-select">値を取得</button>
                    </dd>
                </dl>

                <!-- ファイル選択 -->
                <dl>
                    <dt>単一のテキストファイル</dt>
                    <dd><input type="file" id="textfile" accept=".txt" name="file" /></dd>
                    <dd><output id="file"></output></dd>
                </dl>

                <!-- 画像ファイル選択 -->
                <dl>
                    <dt>単一の画像ファイル</dt>
                    <dd><input type="file" id="image-upload" accept=".jpg, .png" /></dd>
                    <dd id="content"><img /></dd>
                </dl>

                <!-- contenteditable属性がついた要素  -->
                <!-- ! gitAPで使う！ P508-509 -->
                <dl>
                    <dt>contenteditable</dt>
                    <dd>
                        <p id="para" name="para" contenteditable>
                            &lt;p&gt;にcontenteditable属性をつけた要素。利用者がテキストを編集できます。フォームとは異なる見た目で表示できるため、Webアプリケーションでよく使われます。
                        </p>
                    </dd>
                    <dd>
                        <button type="button" id="btn-contenteditable">値を取得</button>
                    </dd>
                </dl>

                <!-- ログインフォーム -->
                <dl>
                    <dd>
                        メールアドレスまたはユーザー名<br />
                        <input type="text" name="username" id="username" required />
                    </dd>
                    <dd>
                        パスワード<br />
                        <input type="password" name="password" id="password" required />
                    </dd>
                    <dd>
                        <input type="submit" value="ログイン" />
                    </dd>
                </dl>
            </form>
        </div>
    </main>
</body>

</html>
