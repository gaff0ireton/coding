<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クラスとID</title>
    <meta name="description" content="クラス属性とID属性について">
    <link rel="stylesheet" href="css/box.css">
</head>

<body>
    <p>クラスを指定しない場合は灰色でテキストを表示</p>
    <p class="blue text-center small" id="green">クラスを指定した部分は青でテキストを表示</p>
    <p class="blue small">クラスを指定した部分は青でテキストを表示</p>
    <p class="text-center small">クラスを指定した部分は青でテキストを表示</p>
    <p id="orange">ID属性を指定した部分はオレンジでテキストを表示</p>

</body>

</html>
