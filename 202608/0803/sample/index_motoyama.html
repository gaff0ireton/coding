<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLとCSS基礎2回目</title>
    <meta name="description" content="HTMLとCSSの学習中です。">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- サイト上部 -->
    <header>
        <h1>HTMLとCSS基礎2回目</h1>
        <!-- ナビゲーションメニュー -->
        <nav>
            <ul>
                <li><a href="">メニュー１</a></li>
                <li><a href="">メニュー２</a></li>
                <li><a href="">メニュー３</a></li>
            </ul>
        </nav>
    </header>

    <!-- メインエリア -->
    <main>
        <div>
            <section>
                <h2>章の見出し</h2>
                <p>セクションの中の段落。</p>
            </section>
            <!-- 記事・独立したコンテンツ -->
            <article>
                <h2>記事部分</h2>
                <section>
                    <h3>記事部分の節</h3>
                    <p>記事内容の段落</p>
                </section>
            </article>
            <!-- 補足情報 -->
            <aside>
                <h2>補足情報を入れる</h2>
                <p>広告や著者プロフィール、人気記事ランク、などなど</p>
            </aside>
        </div>
    </main>

    <footer>
        <p>
            <small>&copy;2026 motoyama.</small>
        </p>
    </footer>
</body>

</html>
