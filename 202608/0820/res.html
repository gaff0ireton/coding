<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レスポンシブ基礎</title>
    <meta name="description" content="レスポンシブ基礎">
    <link rel="stylesheet" href="css/ress.css">
    <link rel="stylesheet" href="css/res.css">
</head>
<body>
    <header>
        <h1>レスポンシブについて</h1>
    </header>
    <main>
        <section id="sec01">
            <h2>画像・iframeのレスポンシブ
            </h2>
            <div class="imgbox"><img src="images/outside.webp" alt="店舗外観"></div>
            <div class="iframebox">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/sT1A-4zjKqQ?si=GrUfOX-17DpdkIoP" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            <div class="iframebox">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/tjIvIiIRFc4?si=3-909mOBq3nq8S7v" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </section>
        <section id="sec02">
            <h2>要素幅の管理</h2>
            <div class="imgbox2">
                <img src="images/menu1.webp" alt="アボカドトースト">
            </div>
        </section>

        <section id="sec03">
            <h2>レイアウトの変更</h2>
            <div class="sec03box">
                <div class="imgbox03">
                    <img src="images/menu2.webp" alt="生ハムカプレーゼ">
                </div>
                <p>これは生ハムカプレーゼです。美味しいと思います。</p>
            </div>
        </section>
    </main>
</body>
</html>
