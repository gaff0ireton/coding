<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@3.0.2/destyle.css

">
    <style>
        img {
            width: 100%;
            max-width: 100%;
            height: 100%;
            object-fit: cover;
        }

        section {
            max-width: 500px;
            border-radius: 1rem;
            border: 1px solid #000;
            box-shadow: 1rem 1rem 0 0 #000;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .dog-img {
            border-radius: 1rem;
            aspect-ratio: 1/1;
            overflow: hidden;
        }
        
        .dog-btn {
            align-self: flex-start;
            padding: 1rem;
            border-radius: 1rem;
            background-color: rgb(121, 185, 185);
            transition: .5s;

            &:hover {
                background-color: rgb(65, 180, 180);
            }
        }
    </style>
</head>
<body>
    <section>
        <div class="dog-img">
            <img src="" alt="random dog">
        </div>
        <button class="dog-btn">GOOD BOY...</button>
    </section>
    <script src="js/script.js" type="module"></script>
</body>
</html>
